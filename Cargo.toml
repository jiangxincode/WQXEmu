[workspace]
resolver = "2"
members = [
    "crates/wqxemu-core",
    "crates/wqxemu",
    "crates/wqxemu-libretro",
]
default-members = ["crates/wqxemu"]

[workspace.package]
version = "0.1.0"
edition = "2021"
description = "A deterministic, cross-platform emulator for Wenquxing NC1020 electronic dictionary"
license = "GPL-3.0-or-later"
repository = "https://github.com/AloysHF/WQXEmu"

[workspace.dependencies]
wqxemu-core = { path = "crates/wqxemu-core" }
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde-big-array = "0.5"
bincode = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
strip = true
